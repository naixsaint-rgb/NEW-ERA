name: CI

on:
  push:
    branches: [main, claude/alzheimer-caregiver-app-uxrrni]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerar catálogo y comprobar que está al día
        run: |
          python3 -I tools/build_catalogo_app.py
          git diff --exit-code app/assets/catalogo

      - name: Instalar libsqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Dependencias
        working-directory: app
        run: flutter pub get

      - name: Regenerar código de drift y comprobar que está al día
        working-directory: app
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code

      - name: Análisis
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Tests de la app
        working-directory: app
        run: flutter test

      - name: safety_core
        working-directory: app/packages/safety_core
        run: |
          dart pub get
          dart analyze
          dart test

  web:
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - name: Compilar web
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --base-href /NEW-ERA/
      - name: Comprobar salida
        working-directory: app
        run: |
          test -f build/web/index.html
          test -f build/web/sqlite3.wasm
          test -f build/web/drift_worker.js
          test -f build/web/assets/assets/catalogo/catalogo.json
      # Pages se sirve desde la rama gh-pages (se activó sola al crear la rama).
      - name: Publicar en GitHub Pages (rama gh-pages)
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/build/web
          force_orphan: true
          commit_message: "demo web ${{ github.sha }}"

  apk:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      # Servidor cartero (supabase/README.md): si los secretos no existen llegan
      # vacíos y la app funciona solo en local. La clave anon es pública por
      # diseño. La web de Pages no los recibe: es una demo pública sin cifrar.
      - name: Compilar APK de depuración
        working-directory: app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter pub get
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: newera-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
