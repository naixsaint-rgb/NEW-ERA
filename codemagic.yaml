  #     dada de alta en la configuración de Codemagic.
  #   - bundle_identifier: el de project.pbxproj; si se cambia, cambiarlo en
  #     los dos sitios y registrarlo en developer.apple.com (Identifiers).
  #   - Capacidad «Time Sensitive Notifications» en ese identificador (solo
  #     para el plan B de iOS < 26). AlarmKit no lleva entitlement.
