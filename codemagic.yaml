# Codemagic: iOS sin firma (simulador). Sin secretos.
workflows:
  ios-simulador:
    name: iOS simulador
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.7
      xcode: latest # debe ser Xcode 26 o posterior (AlarmKit)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: claude/alzheimer-caregiver-app-uxrrni
          include: true
    scripts:
      - name: Dependencias
        working_directory: app
        script: flutter pub get
      - name: Tests
        working_directory: app
        script: flutter test
      # AlarmKit pide el SDK de iOS 26; AlarmasAlarmKit.swift usa además un
      # inicializador de iOS 26.1, así que hace falta Xcode 26.1 o posterior.
      - name: Comprobar Xcode y SDK (AlarmKit)
        script: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "SDK del simulador: $SDK"
          python3 -c "import sys; v=tuple(int(x) for x in '$SDK'.split('.')[:2]); sys.exit(0 if v >= (26, 1) else 'Hace falta Xcode 26.1 o posterior para AlarmKit')"
      - name: Compilar para el simulador
        working_directory: app
        script: flutter build ios --simulator --debug --verbose
      - name: Empaquetar Runner.app
        working_directory: app/build/ios/iphonesimulator
        script: zip -r Runner.app.zip Runner.app
    artifacts:
      - app/build/ios/iphonesimulator/Runner.app.zip

  # Para cuando haya cuenta de Apple Developer: descomentar y configurar la
